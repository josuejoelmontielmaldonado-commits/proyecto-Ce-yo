# Parcha cada build oficial de Halo CE para Android con los controles táctiles,
# la firma con tu llave y la publica como release de ESTE repositorio.
# El juego parchado revisa estos releases, así que se actualiza solo desde el menú del juego.
name: Parchar y publicar

on:
  schedule:
    - cron: "17 * * * *"      # cada hora, al minuto 17
  workflow_dispatch:
    inputs:
      build:
        description: "Número de build a parchar (vacío = la última del proyecto original)"
        required: false
        default: ""

permissions:
  contents: write

env:
  UPSTREAM: OpenCommunityEdition/OpenCE

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Buscar la build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.build }}
        run: |
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if [ -n "$WANTED" ]; then tag="build-$WANTED"; else tag="$latest"; fi
          echo "Build original más reciente: $latest. Se parchará: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$latest" ]; then echo "is_latest=true" >> "$GITHUB_OUTPUT"; else echo "is_latest=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Ya existe el release $tag en este repositorio. No hay nada que hacer."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.find.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Descargar la build original
        if: steps.find.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          mkdir -p work
          gh release download "$TAG" --repo "$UPSTREAM" --pattern "halo-android-release.zip" --dir work

      - name: Preparar la llave
        if: steps.find.outputs.new == 'true'
        env:
          KS_B64: ${{ secrets.HALO_KS_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Falta el secreto HALO_KS_BASE64"; exit 1; fi
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > halo-touch.p12

      - name: Parchar y firmar
        if: steps.find.outputs.new == 'true'
        env:
          HALO_KS_PASS: ${{ secrets.HALO_KS_PASS }}
        run: |
          if [ -z "$HALO_KS_PASS" ]; then echo "Falta el secreto HALO_KS_PASS"; exit 1; fi
          # Si subiste halo-touch-patcher.zip (un solo archivo), se descomprime aquí
          if [ -f halo-touch-patcher.zip ]; then unzip -q -o halo-touch-patcher.zip -d patcher; fi
          PATCHER=$(find . -name patch_halo_touch.py -not -path "./work/*" | head -n 1)
          if [ -z "$PATCHER" ]; then echo "No encuentro patch_halo_touch.py ni halo-touch-patcher.zip en el repositorio"; exit 1; fi
          echo "Parchador: $PATCHER"
          mkdir -p out
          python3 "$PATCHER" work/halo-android-release.zip \
            -o out/app-release.apk --keystore halo-touch.p12 --update-repo "$GITHUB_REPOSITORY"
          # El juego busca el primer .apk dentro de halo-android-release.zip
          (cd out && zip -q halo-android-release.zip app-release.apk)
          ls -l out

      - name: Publicar el release
        if: steps.find.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
          IS_LATEST: ${{ steps.find.outputs.is_latest }}
        run: |
          flag="--latest=false"
          if [ "$IS_LATEST" = "true" ]; then flag="--latest"; fi
          gh release create "$TAG" out/halo-android-release.zip \
            --repo "$GITHUB_REPOSITORY" --title "$TAG con controles táctiles" \
            --notes "Build oficial $TAG de $UPSTREAM con la capa táctil, firmada con la llave de este repositorio." \
            $flag

      - name: Borrar la llave del ejecutor
        if: always()
        run: rm -f halo-touch.p12
